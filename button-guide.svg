<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect width="800" height="500" fill="#fbfaf7"/>
<text x="30" y="36" font-size="22" font-weight="700" fill="#1f2933">Your 12mm tactile button — how to place it</text>
<text x="30" y="58" font-size="13" fill="#65727c">4 legs = 2 pairs. Same side = same pin (always connected). Press connects LEFT pair to RIGHT pair.</text>

<!-- breadboard -->
<rect x="30" y="80" width="740" height="280" rx="10" fill="#ffffff" stroke="#d0d7dd" stroke-width="2"/>
<!-- center gap -->
<rect x="30" y="205" width="740" height="30" fill="#e9ecef"/>
<text x="40" y="225" font-size="11" fill="#868e96">center gap (e | f — NO connection across)</text>

<!-- grid dots: top half a-e, bottom half f-j -->
<g fill="#adb5bd" font-size="10">
<!-- column numbers -->
</g>
<g id="dots" fill="#343a40">
<!-- draw simplified holes -->
</g>
<script></script>
<!-- We'll manually draw holes with pattern using groups -->
<g fill="#ced4da">
<!-- top rows -->
<!-- for clarity just draw 10 cols x 5+5 rows as rects -->
</g>
<g>
<!-- top terminal: rows a-e -->
<!-- Use small squares -->
<!-- generate by hand: x start 80, step 60, y 95..190 -->
<!-- Row labels left -->
<text x="45" y="115" font-size="12" fill="#495057">a</text>
<text x="45" y="140" font-size="12" fill="#495057">b</text>
<text x="45" y="165" font-size="12" fill="#495057">c</text>
<text x="45" y="185" font-size="12" fill="#495057">d</text>
<text x="45" y="202" font-size="12" fill="#495057">e</text>
<text x="45" y="258" font-size="12" fill="#495057">f</text>
<text x="45" y="280" font-size="12" fill="#495057">g</text>
<text x="45" y="302" font-size="12" fill="#495057">h</text>
<text x="45" y="324" font-size="12" fill="#495057">i</text>
<text x="45" y="346" font-size="12" fill="#495057">j</text>
</g>
<!-- holes -->
<g fill="#212529">
<!-- top: 10 columns -->
<!-- y positions -->
<!-- x=90,150,210,270,330,390,450,510,570,630,690 -->
<!-- We'll draw circles via path? use rect small -->
<!-- manual loop in svg: just place many small rects -->
<g id="holes-top">
<!-- col labels -->
<text x="90" y="92" font-size="10" text-anchor="middle" fill="#868e96">5</text>
<text x="150" y="92" font-size="10" text-anchor="middle" fill="#868e96">6</text>
<text x="210" y="92" font-size="10" text-anchor="middle" fill="#868e96">7</text>
<text x="270" y="92" font-size="10" text-anchor="middle" fill="#868e96">8</text>
<text x="330" y="92" font-size="10" text-anchor="middle" fill="#868e96">9</text>
<text x="390" y="92" font-size="10" text-anchor="middle" fill="#868e96">10</text>
<text x="450" y="92" font-size="10" text-anchor="middle" fill="#868e96">11</text>
<text x="510" y="92" font-size="10" text-anchor="middle" fill="#868e96">12</text>
</g>
</g>

<!-- actual holes as small squares using many rects -->
<g fill="#1c1e20">
<!-- top 5 rows y=105,130,155,175,192 -->
<!-- bottom 5 rows y=248,270,292,314,336 -->
<!-- xs 84,144,204,264,324,384,444,504 -->
<rect x="84" y="105" width="12" height="8" rx="2"/><rect x="144" y="105" width="12" height="8" rx="2"/><rect x="204" y="105" width="12" height="8" rx="2"/><rect x="264" y="105" width="12" height="8" rx="2"/><rect x="324" y="105" width="12" height="8" rx="2"/><rect x="384" y="105" width="12" height="8" rx="2"/><rect x="444" y="105" width="12" height="8" rx="2"/><rect x="504" y="105" width="12" height="8" rx="2"/>
<rect x="84" y="130" width="12" height="8" rx="2"/><rect x="144" y="130" width="12" height="8" rx="2"/><rect x="204" y="130" width="12" height="8" rx="2"/><rect x="264" y="130" width="12" height="8" rx="2"/><rect x="324" y="130" width="12" height="8" rx="2"/><rect x="384" y="130" width="12" height="8" rx="2"/><rect x="444" y="130" width="12" height="8" rx="2"/><rect x="504" y="130" width="12" height="8" rx="2"/>
<rect x="84" y="155" width="12" height="8" rx="2"/><rect x="144" y="155" width="12" height="8" rx="2"/><rect x="204" y="155" width="12" height="8" rx="2"/><rect x="264" y="155" width="12" height="8" rx="2"/><rect x="324" y="155" width="12" height="8" rx="2"/><rect x="384" y="155" width="12" height="8" rx="2"/><rect x="444" y="155" width="12" height="8" rx="2"/><rect x="504" y="155" width="12" height="8" rx="2"/>
<rect x="84" y="175" width="12" height="8" rx="2"/><rect x="144" y="175" width="12" height="8" rx="2"/><rect x="204" y="175" width="12" height="8" rx="2"/><rect x="264" y="175" width="12" height="8" rx="2"/><rect x="324" y="175" width="12" height="8" rx="2"/><rect x="384" y="175" width="12" height="8" rx="2"/><rect x="444" y="175" width="12" height="8" rx="2"/><rect x="504" y="175" width="12" height="8" rx="2"/>
<rect x="84" y="192" width="12" height="8" rx="2"/><rect x="144" y="192" width="12" height="8" rx="2"/><rect x="204" y="192" width="12" height="8" rx="2"/><rect x="264" y="192" width="12" height="8" rx="2"/><rect x="324" y="192" width="12" height="8" rx="2"/><rect x="384" y="192" width="12" height="8" rx="2"/><rect x="444" y="192" width="12" height="8" rx="2"/><rect x="504" y="192" width="12" height="8" rx="2"/>

<rect x="84" y="248" width="12" height="8" rx="2"/><rect x="144" y="248" width="12" height="8" rx="2"/><rect x="204" y="248" width="12" height="8" rx="2"/><rect x="264" y="248" width="12" height="8" rx="2"/><rect x="324" y="248" width="12" height="8" rx="2"/><rect x="384" y="248" width="12" height="8" rx="2"/><rect x="444" y="248" width="12" height="8" rx="2"/><rect x="504" y="248" width="12" height="8" rx="2"/>
<rect x="84" y="270" width="12" height="8" rx="2"/><rect x="144" y="270" width="12" height="8" rx="2"/><rect x="204" y="270" width="12" height="8" rx="2"/><rect x="264" y="270" width="12" height="8" rx="2"/><rect x="324" y="270" width="12" height="8" rx="2"/><rect x="384" y="270" width="12" height="8" rx="2"/><rect x="444" y="270" width="12" height="8" rx="2"/><rect x="504" y="270" width="12" height="8" rx="2"/>
<rect x="84" y="292" width="12" height="8" rx="2"/><rect x="144" y="292" width="12" height="8" rx="2"/><rect x="204" y="292" width="12" height="8" rx="2"/><rect x="264" y="292" width="12" height="8" rx="2"/><rect x="324" y="292" width="12" height="8" rx="2"/><rect x="384" y="292" width="12" height="8" rx="2"/><rect x="444" y="292" width="12" height="8" rx="2"/><rect x="504" y="292" width="12" height="8" rx="2"/>
<rect x="84" y="314" width="12" height="8" rx="2"/><rect x="144" y="314" width="12" height="8" rx="2"/><rect x="204" y="314" width="12" height="8" rx="2"/><rect x="264" y="314" width="12" height="8" rx="2"/><rect x="324" y="314" width="12" height="8" rx="2"/><rect x="384" y="314" width="12" height="8" rx="2"/><rect x="444" y="314" width="12" height="8" rx="2"/><rect x="504" y="314" width="12" height="8" rx="2"/>
<rect x="84" y="336" width="12" height="8" rx="2"/><rect x="144" y="336" width="12" height="8" rx="2"/><rect x="204" y="336" width="12" height="8" rx="2"/><rect x="264" y="336" width="12" height="8" rx="2"/><rect x="324" y="336" width="12" height="8" rx="2"/><rect x="384" y="336" width="12" height="8" rx="2"/><rect x="444" y="336" width="12" height="8" rx="2"/><rect x="504" y="336" width="12" height="8" rx="2"/>
</g>

<!-- highlight connected columns: col 8 and 10 -->
<rect x="255" y="100" width="30" height="104" rx="6" fill="none" stroke="#2f9e44" stroke-width="2" stroke-dasharray="5 4"/>
<rect x="255" y="244" width="30" height="104" rx="6" fill="none" stroke="#e03131" stroke-width="2" stroke-dasharray="5 4"/>

<!-- button body straddling -->
<rect x="235" y="155" width="130" height="130" rx="10" fill="#212529" stroke="#000" stroke-width="2"/>
<circle cx="300" cy="220" r="32" fill="#000" stroke="#495057" stroke-width="3"/>
<circle cx="252" cy="172" r="5" fill="#868e96"/>
<circle cx="348" cy="172" r="5" fill="#868e96"/>
<circle cx="252" cy="268" r="5" fill="#868e96"/>
<circle cx="348" cy="268" r="5" fill="#868e96"/>
<!-- legs -->
<rect x="258" y="196" width="10" height="18" fill="#ced4da" stroke="#868e96"/>
<rect x="332" y="196" width="10" height="18" fill="#ced4da" stroke="#868e96"/>
<rect x="258" y="272" width="10" height="18" fill="#ced4da" stroke="#868e96"/>
<rect x="332" y="272" width="10" height="18" fill="#ced4da" stroke="#868e96"/>

<!-- wires -->
<path d="M270 196 L270 130 L620 130" stroke="#2f9e44" stroke-width="3" fill="none"/>
<circle cx="620" cy="130" r="5" fill="#2f9e44"/>
<text x="630" y="134" font-size="13" fill="#2f9e44" font-weight="600">to GPIO 32 (Button 1)</text>

<path d="M340 290 L340 314 L620 314" stroke="#65727c" stroke-width="3" fill="none"/>
<circle cx="620" cy="314" r="5" fill="#65727c"/>
<text x="630" y="318" font-size="13" fill="#343a40" font-weight="600">to GND</text>

<!-- internal connection note -->
<path d="M245 190 L245 155" stroke="#fab005" stroke-width="2"/>
<text x="580" y="200" font-size="12" fill="#704503">left 2 legs = same net —</text>
<text x="580" y="217" font-size="12" fill="#704503">use only ONE column (e.g. col 8)</text>
<text x="580" y="245" font-size="12" fill="#704503">right 2 legs = same net —</text>
<text x="580" y="262" font-size="12" fill="#704503">use only ONE column (e.g. col 10)</text>

<text x="30" y="395" font-size="14" font-weight="700" fill="#2f9e44">CORRECT: straddle the middle gap (e-row to f-row)</text>
<text x="30" y="417" font-size="13" fill="#343a40">Like your photo 1 — button over the ravine. a–e are one strip, f–j are another. This gives GPIO —[open]— GND.</text>
<text x="30" y="442" font-size="14" font-weight="700" fill="#e03131">WRONG: both sides in a–e only (or f–j only)</text>
<text x="30" y="464" font-size="13" fill="#343a40">Button will read always-pressed or never-pressed — the pair on the same side is already shorted inside.</text>
</svg>